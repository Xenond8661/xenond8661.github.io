name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A4DF2F: ${{ secrets.A4DF2F }}
          B59E26: ${{ secrets.B59E26 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A4DF2F', '')
          tag_b = os.environ.get('B59E26', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 52620bf8c3d6dc2da8312483fe16beda7189c400e5 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- eee964475520215d2dc197f53d2bdd7a85288f2ee672e82b -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
